system:
  type: spin_boson
  params:
    n_levels: 6
    phi_s: 0.0
    eta: 0.075
    mode_vector:
    - 0.5
    - -0.5
    target_gate: ms_xx_pi_over_2
    alpha1_khz_bounds:
    - 1.0
    - 60.0
    alpha2_khz_bounds:
    - 0.0
    - 200.0
    initial_pulse_shape: random
    alpha1_cycles: 1.0
    alpha1_offset_fraction: 0.7
    alpha1_noise_fraction: 0.3
  noise:
    decoherence:
      enabled: false
    fluctuations:
      enabled: false
pulse:
  n_steps: 400
  total_time_us: 122.01330779422334
  random_seed: 12345
objective:
  max_order: 2
  drop_odd_average: true
  normalize_weights: false
optimizer:
  method: L-BFGS-B
  maxiter: 250
  gtol: 1.0e-12
  ftol: 1.0e-15
  maximize: true
penalty:
  l1_smooth_weight: 1.0e-7
  l2_smooth_weight: 1.0e-5
runtime:
  workers: 10
  print_step: false
  print_fidelity_terms: false
  save_fidelity_terms: null
  initial_pulse_npz: experiments/spin_boson/robustness_eval/best_time_shrink_flattop/random_smooth_s400.npz
  no_progress: true
output:
  output_root: experiments/spin_boson/robustness_eval/flattop_122us/outputs
  prefix: close-122us
